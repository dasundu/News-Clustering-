# Runs the event clustering pipeline on a schedule:
# scrape -> extract -> clean -> embed -> cluster, against the Neon database.
# The read-only API (render.yaml) serves the results.
#
# Hourly. This repository is public, so GitHub Actions minutes are free and
# unlimited. A run takes 3-5 minutes.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL     the Neon connection string from your local .env
#   GEMINI_API_KEY   the Gemini key from the same file
#
# "Run workflow" on the Actions tab triggers a run by hand.
name: Clustering pipeline

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17 to avoid the top-of-hour queue
  workflow_dispatch:

# Two runs must never overlap: both would claim the same articles and race on
# cluster ids. A run that is still going makes the next one wait.
concurrency:
  group: clustering-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_DIMENSION: "768"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Set the DATABASE_URL and GEMINI_API_KEY repository secrets."
            exit 1
          fi

      - name: Run pipeline
        run: python pipeline.py
